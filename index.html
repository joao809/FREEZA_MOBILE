<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREEZA MOBILE BYPASS VIP</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --panel-bg: #13131a;
            --accent-red: #ff2a5f;
            --accent-blue: #00f0ff;
            --accent-purple: #9d00ff;
            --text-color: #e0e0e6;
            --green-terminal: #00ff66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 2px solid var(--accent-purple);
            box-shadow: 0 0 15px rgba(157, 0, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 10px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--accent-blue);
            padding-bottom: 10px;
        }

        h1 {
            font-size: 1.1rem;
            color: var(--accent-red);
            text-shadow: 0 0 5px var(--accent-red);
            text-align: center;
            flex-grow: 1;
        }

        select {
            background: #000;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 5px;
            border-radius: 5px;
            font-size: 0.8rem;
        }

        .section-title {
            color: var(--accent-blue);
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            border-left: 3px solid var(--accent-purple);
            padding-left: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: var(--accent-purple);
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #050508;
            border: 1px solid var(--accent-blue);
            color: var(--text-color);
            border-radius: 5px;
            font-size: 0.9rem;
        }

        input[type="file"] {
            cursor: pointer;
            color: #888;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-purple));
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(255, 42, 95, 0.4);
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Terminal Hacking Binário */
        .terminal {
            background: #000;
            border: 1px solid var(--green-terminal);
            color: var(--green-terminal);
            padding: 10px;
            height: 130px;
            overflow-y: auto;
            font-size: 0.75rem;
            border-radius: 5px;
            margin-top: 15px;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .output-box {
            margin-top: 15px;
            background: #050508;
            border: 1px solid var(--accent-purple);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .output-box p {
            font-size: 0.8rem;
            word-break: break-all;
            margin-bottom: 8px;
            color: var(--green-terminal);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #0051ff, var(--accent-blue));
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>FREEZA MOBILE BYPASS VIP</h1>
            <select id="langSelect" onchange="changeLanguage()">
                <option value="pt">PT-BR</option>
                <option value="en">ENG</option>
                <option value="es">ESP</option>
            </select>
        </header>

        <div class="section-title" id="txtSectionTitle">Bypass para Fileinfo da Shaders</div>

        <div class="form-group">
            <label id="txtLabelName">Nome que você quer ter na Shaders:</label>
            <input type="text" id="shaderNameInput" placeholder="Ex: Criador~FreezaMobile" value="Criador~FreezaMobile">
        </div>

        <div class="form-group">
            <label id="txtLabelFile">Selecionar Arquivo fileinfo:</label>
            <input type="file" id="fileInput" onchange="handleFileLoaded()">
        </div>

        <button id="btnApply" onclick="applyBypass()">Aplicar Bypass</button>

        <!-- Terminal Binário Censurado / Seguro -->
        <div class="terminal" id="terminalLog">
            [SYS] Aguardando upload do arquivo fileinfo...<br>
            01000110 01010010 01000101 01000101 01011010 01000001
        </div>

        <!-- Resultados e Download -->
        <div class="output-box" id="outputBox">
            <label id="txtOutputLabel">Você deve Adicionar este nome no Arquivo da Shaders do Seu Holograma⬇️:</label>
            <p id="outputFileName">shaders.Criador~FreezaMobile~3D</p>
            <button class="btn-secondary" id="btnCopy" onclick="copyOutputName()">Copiar Nome</button>
            <button id="btnDownload" onclick="downloadModifiedFile()">Baixar Fileinfo Modificado</button>
        </div>
    </div>

    <script>
        let fileContent = "";
        let modifiedFileContent = "";
        let finalShaderGameName = "";

        const texts = {
            pt: {
                title: "Bypass para Fileinfo da Shaders",
                labelName: "Nome que você quer ter na Shaders:",
                labelFile: "Selecionar Arquivo fileinfo:",
                btnApply: "Aplicar Bypass",
                outputLabel: "Você deve Adicionar este nome no Arquivo da Shaders do Seu Holograma⬇️:",
                btnCopy: "Copiar Nome",
                btnDownload: "Baixar Fileinfo Modificado"
            },
            en: {
                title: "Shaders Fileinfo Bypass",
                labelName: "Custom Shaders Name:",
                labelFile: "Select fileinfo file:",
                btnApply: "Apply Bypass",
                outputLabel: "Shaders Output File Name:",
                btnCopy: "Copy Name",
                btnDownload: "Download Modified Fileinfo"
            },
            es: {
                title: "Bypass para Fileinfo de Shaders",
                labelName: "Nombre Personalizado Shaders:",
                labelFile: "Seleccionar archivo fileinfo:",
                btnApply: "Aplicar Bypass",
                outputLabel: "Nombre de Salida del Archivo Shaders:",
                btnCopy: "Copiar Nombre",
                btnDownload: "Descargar Fileinfo Modificado"
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            document.getElementById('txtSectionTitle').innerText = texts[lang].title;
            document.getElementById('txtLabelName').innerText = texts[lang].labelName;
            document.getElementById('txtLabelFile').innerText = texts[lang].labelFile;
            document.getElementById('btnApply').innerText = texts[lang].btnApply;
            document.getElementById('txtOutputLabel').innerText = texts[lang].outputLabel;
            document.getElementById('btnCopy').innerText = texts[lang].btnCopy;
            document.getElementById('btnDownload').innerText = texts[lang].btnDownload;
        }

        function logTerminal(text) {
            const term = document.getElementById('terminalLog');
            term.innerHTML += `<br>> ${text}`;
            term.scrollTop = term.scrollHeight;
        }

        // Executado ao carregar o arquivo
        function handleFileLoaded() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            const reader = new FileReader();

            document.getElementById('terminalLog').innerHTML = `[SECURE] Carregando container de dados...<br>01001100 01001111 01000001 01000100 01000101 01000100`;

            reader.onload = function(e) {
                fileContent = e.target.result;
                logTerminal(`[OK] Hash do arquivo validado com sucesso.`);
                logTerminal("01010011 01010100 01000001 01001110 01000010 01011001");
                logTerminal("[AUTH] Pronto para injeção de parâmetros VIP.");
            };

            reader.readAsText(file);
        }

        // Executado ao clicar em Aplicar Bypass
        function applyBypass() {
            if (!fileContent) {
                alert("Por favor, selecione o arquivo fileinfo primeiro!");
                return;
            }

            const customName = document.getElementById('shaderNameInput').value.trim() || "Criador~FreezaMobile";
            logTerminal("-----------------------------------------");
            logTerminal("[CRYPT] Iniciando sequência de offuscamento...");
            logTerminal("01010011 01000101 01000011 01010101 01010010 01000101");

            let lines = fileContent.split(/\r?\n/);
            
            let shaderIndex = -1;
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith("shaders,")) {
                    shaderIndex = i;
                    break;
                }
            }

            if (shaderIndex === -1) {
                logTerminal("[ERROR] Falha na assinatura do binário.");
                alert("Erro: O arquivo não contém a estrutura compatível.");
                return;
            }

            logTerminal(`[SYS] Alvo principal localizado. Aplicando patches...`);
            
            let startIndex = Math.max(0, shaderIndex - 4);

            for (let i = startIndex; i <= shaderIndex; i++) {
                let modifiedLine = lines[i].replace(/True/g, "False");
                
                if (!modifiedLine.endsWith(",False")) {
                    modifiedLine += ",False";
                }

                if (i === shaderIndex) {
                    let parts = modifiedLine.split(',');
                    if (parts.length > 1) {
                        parts[1] = customName + "=";
                        modifiedLine = parts.join(',');
                    }
                    logTerminal(`[PATCH] Injetando assinatura de identidade [PROTECTED]`);
                }

                lines[i] = modifiedLine;
            }

            logTerminal(`[SEC] Otimizando strings de dados binários...`);

            modifiedFileContent = lines.join('\n');
            finalShaderGameName = `shaders.${customName}~3D`;

            document.getElementById('outputFileName').innerText = finalShaderGameName;
            document.getElementById('outputBox').style.display = 'block';
            
            logTerminal("[SUCCESS] Bypass gerado com criptografia oculta!");
            logTerminal("[READY] Pronto para download seguro.");
        }

        function copyOutputName() {
            navigator.clipboard.writeText(finalShaderGameName).then(() => {
                alert("Nome copiado para a área de transferência: " + finalShaderGameName);
            });
        }

        function downloadModifiedFile() {
            // Força o tipo application/octet-stream para o mobile não colocar .txt
            const blob = new Blob([modifiedFileContent], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fileinfo'; // Nome exato sem extensão
            
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }
    </script>
</body>
</html>
